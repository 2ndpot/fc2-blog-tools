<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>数独ブログ生成・検証エンジン (Ver 7.83 Robust Edition)</title>
  <link rel="stylesheet" href="https://2ndpot.github.io/fc2-blog-tools/sudoku/css/sudoku-admin.css">
</head>
<body>

<div class="layout">
  <div class="panel">
    <div class="step-controls">
      <button class="btn-deck btn-deck-reset" id="btn-reset">⏪ 最初に戻る</button>
      <button class="btn-deck btn-deck-prev" id="btn-prev" disabled>◀️ 1ステップ戻る</button>
      <button class="btn-deck btn-deck-next" id="btn-next">1ステップ進む ▶️</button>
      <button class="btn-deck btn-deck-ff" id="btn-auto">一気に進む ⏩</button>
    </div>

    <div class="board-container">
      <div class="board" id="grid"></div>
      <svg class="svg-overlay" id="svg-overlay"></svg>
    </div>

    <h3>🔍 解析ログ</h3>
    <div class="log" id="log"></div>
  </div>

  <div class="panel">
    <h2>データ入力・管理</h2>
    <div class="form-group">
      <label>管理タイトル</label>
      <input type="text" id="in-title" value="Ver 7.83 Manual Elimination">
    </div>
    <button class="btn-tgl" id="btn-clear" style="width: 100%; margin-bottom: 12px; background: #e0e0e0; color: #333; border: 1px solid #ccc;">全入力をクリア</button>
    
    <div class="form-group">
      <label>1. 初期グリッド (81桁)</label>
      <input type="text" id="in-init" value="000001000073086400000000031009100005700040000006000090000530260294000000000000007">
    </div>
    <div class="form-group">
      <label>2. 途中グリッド (81桁)</label>
      <input type="text" id="in-curr" value="">
    </div>
    
    <div class="btn-group-row">
      <button class="btn-blue" id="btn-init-engine">盤面を生成</button>
      <button class="btn-orange" id="btn-get-curr">途中グリッドを取得</button>
    </div>

    <div class="form-group" style="margin-top: 15px; background: #f0f4f8; padding: 10px; border-radius: 6px; border: 1px solid #d0d7de;">
      <label>🔗 数字強調 & 共役対（強鎖）フィルター</label>
      <div class="digit-btn-group" id="digit-buttons"></div>
    </div>

    <div style="margin-top:15px;">
      <label>💻 ブログ埋め込み用 JSON 出力</label>
      <textarea id="out-json" readonly></textarea>
      <button class="btn-green" id="btn-copy">JSONをコピー</button>
    </div>
  </div>
</div>

<script type="module">
import { analyzeNextStep } from './js/logic/solver.js';

(() => {
  let memoryGrid = [];
  let showCand = false;
  let isCandidateInitialized = false;
  let nextPhase = "preview";
  let currentMove = null;
  
  let selectedDigit = null;
  let historyStack = [];
  let highlights = { blueCells: [], blueCands: [], redCands: [], chainLinks: [] };

  const elTitle   = document.getElementById("in-title");
  const elInit    = document.getElementById("in-init");
  const elCurr    = document.getElementById("in-curr");
  const elGrid    = document.getElementById("grid");
  const elSvg     = document.getElementById("svg-overlay");
  const elLog     = document.getElementById("log");
  const elOut     = document.getElementById("out-json");
  const btnNext   = document.getElementById("btn-next");
  const btnPrev   = document.getElementById("btn-prev");
  const btnGetCurr = document.getElementById("btn-get-curr");

  const getR = (obj) => obj.cell ? obj.cell.row : obj.row;
  const getC = (obj) => obj.cell ? obj.cell.col : obj.col;

  function writeLog(text, type = "") {
    const div = document.createElement("div");
    if (type) div.className = `log-${type}`;
    div.textContent = text;
    elLog.appendChild(div);
    elLog.scrollTop = elLog.scrollHeight;
  }

  function clearHighlights() {
    highlights = { blueCells: [], blueCands: [], redCands: [], chainLinks: [] };
  }

  function initDigitButtons() {
    const container = document.getElementById("digit-buttons");
    container.innerHTML = "";
    for (let i = 1; i <= 9; i++) {
      const btn = document.createElement("button");
      btn.className = "btn-digit";
      btn.textContent = i;
      btn.addEventListener("click", () => selectDigitForChain(i));
      container.appendChild(btn);
    }
    const btnClear = document.createElement("button");
    btnClear.className = "btn-digit-clear";
    btnClear.textContent = "解除";
    btnClear.addEventListener("click", () => selectDigitForChain(null));
    container.appendChild(btnClear);
  }

  function selectDigitForChain(num) {
    selectedDigit = (selectedDigit === num) ? null : num;
    document.querySelectorAll(".btn-digit").forEach((btn, idx) => {
      if (idx + 1 === selectedDigit) btn.classList.add("active");
      else btn.classList.remove("active");
    });
    render();
  }

  function getConjugatePairs(grid, num) {
    if (!num) return { weakCells: [], strongCells: [] };
    const strongSet = new Set(), weakSet = new Set();
    grid.forEach(c => { if (c.status === "candidate" && c.val.includes(num)) weakSet.add(c); });
    ["row", "col", "box"].forEach(houseType => {
      for (let hIdx = 0; hIdx < 9; hIdx++) {
        const houseCells = grid.filter(c => c.status === "candidate" && c[houseType] === hIdx && c.val.includes(num));
        if (houseCells.length === 2) { strongSet.add(houseCells[0]); strongSet.add(houseCells[1]); }
      }
    });
    return { weakCells: Array.from(weakSet), strongCells: Array.from(strongSet) };
  }

  function pushHistory() {
    try {
      const state = {
        grid: JSON.parse(JSON.stringify(memoryGrid)),
        showCand: showCand,
        isCandidateInitialized: isCandidateInitialized,
        nextPhase: nextPhase,
        currentMove: currentMove,
        highlights: {
          blueCellsCoords: (highlights.blueCells || []).map(c => ({ row: c.row, col: c.col })),
          blueCandsCoords: (highlights.blueCands || []).map(h => ({ row: getR(h), col: getC(h), num: h.num })),
          redCandsCoords:  (highlights.redCands || []).map(h => ({ row: getR(h), col: getC(h), num: h.num })),
          chainLinks: highlights.chainLinks || []
        },
        logHTML: elLog.innerHTML,
        btnNextDisabled: btnNext.disabled
      };
      historyStack.push(state);
      btnPrev.disabled = false;
    } catch(e) {
      console.error("履歴の保存に失敗しました:", e);
    }
  }

  function stepBack() {
    if (historyStack.length === 0) return;
    try {
      const prevState = historyStack.pop();
      memoryGrid = prevState.grid;
      showCand = prevState.showCand;
      isCandidateInitialized = prevState.isCandidateInitialized;
      nextPhase = prevState.nextPhase;
      currentMove = prevState.currentMove;
      elLog.innerHTML = prevState.logHTML;
      btnNext.disabled = prevState.btnNextDisabled;

      highlights.blueCells = prevState.highlights.blueCellsCoords.map(pos => 
        memoryGrid.find(c => c.row === pos.row && c.col === pos.col)
      ).filter(Boolean);

      highlights.blueCands = prevState.highlights.blueCandsCoords.map(pos => ({
        cell: memoryGrid.find(c => c.row === pos.row && c.col === pos.col),
        row: pos.row, col: pos.col, num: pos.num
      })).filter(h => h.cell);

      highlights.redCands = prevState.highlights.redCandsCoords.map(pos => ({
        cell: memoryGrid.find(c => c.row === pos.row && c.col === pos.col),
        row: pos.row, col: pos.col, num: pos.num
      })).filter(h => h.cell);

      highlights.chainLinks = prevState.highlights.chainLinks || [];
      if (historyStack.length === 0) btnPrev.disabled = true;
      
      render();
    } catch(e) {
      console.error("1ステップ戻る処理でエラー:", e);
    }
  }

  function removeCandidateManually(cell, num) {
    pushHistory();
    clearHighlights();
    
    const idx = cell.val.indexOf(num);
    if (idx > -1) {
      cell.val.splice(idx, 1);
      writeLog(`【🖐️手動介入】R${cell.row + 1}C${cell.col + 1} から 候補数字 [${num}] を手動削除しました。`, "manual");
    }

    nextPhase = "preview";
    currentMove = null;
    btnNext.disabled = false;
    render();
  }

  function checkValid(str, name) {
    if (str.length !== 81) { writeLog(`【❌エラー】${name}が81桁ではありません。`, "err"); return false; }
    if (!/^[0-9]+$/.test(str)) { writeLog(`【❌エラー】${name}に数字以外が含まれています。`, "err"); return false; }
    return true;
  }

  function checkDup(grid) {
    let err = false;
    grid.forEach((c, i) => {
      if (c.status === "candidate") return;
      grid.forEach((t, ti) => {
        if (i === ti || t.status === "candidate") return;
        if (c.val === t.val && (c.row === t.row || c.col === t.col || c.box === t.box)) {
          c.err = t.err = err = true;
          writeLog(`【❌重複エラー】R${c.row+1}C${c.col+1} と R${t.row+1}C${t.col+1} で「${c.val}」が重複。`, "err");
        }
      });
    });
    return err;
  }

  function initCandidates(grid) {
    grid.forEach(c => {
      if (c.status !== "candidate") return;
      const used = new Set();
      grid.forEach(t => {
        if (t.status !== "candidate" && (t.row === c.row || t.col === c.col || t.box === c.box)) used.add(t.val);
      });
      c.val = [];
      for (let i = 1; i <= 9; i++) if (!used.has(i)) c.val.push(i);
    });
  }

  function renderOverlayLines() {
    elSvg.innerHTML = "";
    if (!highlights.chainLinks || highlights.chainLinks.length === 0) return;
    const boardRect = elGrid.getBoundingClientRect();
    const cellW = boardRect.width / 9, cellH = boardRect.height / 9;

    highlights.chainLinks.forEach(link => {
      if (!link.from || !link.to) return;
      const num = link.num || 1;
      const subRow = Math.floor((num - 1) / 3), subCol = (num - 1) % 3;
      const x1 = (link.from.col + (subCol + 0.5) / 3) * cellW, y1 = (link.from.row + (subRow + 0.5) / 3) * cellH;
      const x2 = (link.to.col + (subCol + 0.5) / 3) * cellW,   y2 = (link.to.row + (subRow + 0.5) / 3) * cellH;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1); line.setAttribute("y1", y1);
      line.setAttribute("x2", x2); line.setAttribute("y2", y2);

      if (link.type === "strong") {
        line.setAttribute("stroke", "#8e24aa"); line.setAttribute("stroke-width", "3.5"); line.setAttribute("stroke-linecap", "round");
      } else {
        line.setAttribute("stroke", "#e65100"); line.setAttribute("stroke-width", "3"); line.setAttribute("stroke-dasharray", "5,5"); line.setAttribute("stroke-linecap", "round");
      }
      elSvg.appendChild(line);
    });
  }

  function render() {
    elGrid.innerHTML = "";
    const chainInfo = getConjugatePairs(memoryGrid, selectedDigit);

    memoryGrid.forEach(c => {
      const el = document.createElement("div"); 
      el.className = "cell"; 
      el.setAttribute("data-status", c.status);
      if (c.err) el.setAttribute("data-err", "true");
      
      if (highlights.blueCells.includes(c)) el.classList.add("hl-blue-cell");

      if (c.status !== "candidate") {
        el.textContent = c.val;
      } else if (showCand) {
        const g = document.createElement("div"); 
        g.className = "cand-grid";
        for (let i = 1; i <= 9; i++) {
          const n = document.createElement("div"); 
          n.className = "cand-num";
          
          if (c.val && c.val.includes(i)) {
            n.textContent = i;
            n.classList.add("interactive");
            n.title = `クリックで R${c.row+1}C${c.col+1} から「${i}」を手動削除`;
            n.addEventListener("click", (e) => { e.stopPropagation(); removeCandidateManually(c, i); });

            const isBlue = highlights.blueCands.some(h => getR(h) === c.row && getC(h) === c.col && h.num === i);
            const isRed  = highlights.redCands.some(h => getR(h) === c.row && getC(h) === c.col && h.num === i);

            if (isBlue) n.classList.add("hl-blue");
            else if (isRed) n.classList.add("hl-red");
            else if (selectedDigit === i) {
              if (chainInfo.strongCells.includes(c)) n.classList.add("hl-chain-strong");
              else if (chainInfo.weakCells.includes(c)) n.classList.add("hl-chain-weak");
            }
          }
          g.appendChild(n);
        }
        el.appendChild(g);
      }
      elGrid.appendChild(el);
    });
    renderOverlayLines();

    const grid1Str = elInit.value.trim();
    const grid2Str = elCurr.value.trim();
    
    if (grid2Str !== "") {
      const jsonObj = {
        title: elTitle.value,
        grid1: grid1Str,
        grid2: grid2Str
      };
      elOut.value = JSON.stringify(jsonObj, null, 2);
    } else {
      elOut.value = "";
    }
  }

  function setupEngine() {
    elLog.innerHTML = ""; 
    clearHighlights();
    historyStack = [];
    btnPrev.disabled = true;
    btnNext.disabled = false;
    showCand = false;
    isCandidateInitialized = false;
    nextPhase = "preview";
    currentMove = null;

    const sInit = elInit.value.trim();

    if (!checkValid(sInit, "初期グリッド")) return;

    memoryGrid = sInit.split('').map((v, i) => {
      const vi = parseInt(v, 10), r = Math.floor(i / 9), c = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(c / 3);
      if (vi !== 0) return { val: vi, status: "given", row: r, col: c, box: b, err: false };
      return { val: [], status: "candidate", row: r, col: c, box: b, err: false };
    });

    if (checkDup(memoryGrid)) { render(); elOut.value = "エラーのため出力不可"; return; }
    
    initCandidates(memoryGrid);
    writeLog("盤面を生成しました。", "ok");
    render();
  }

  function fetchCurrentGrid() {
    if (memoryGrid.length === 0) {
      alert("先に「盤面を生成」を行ってください。");
      return;
    }
    const currentStr = memoryGrid.map(c => c.status === "candidate" ? 0 : c.val).join('');
    elCurr.value = currentStr;
    writeLog("現在の盤面（ヒント＋確定数字）を「2. 途中グリッド」に取り込みました。", "info");
    render();
  }

  function stepForward() {
    if (btnNext.disabled) return;
    pushHistory();

    if (!isCandidateInitialized) {
      showCand = true;
      isCandidateInitialized = true;
      writeLog("候補数字を表示しました。", "info");
      render();
      return;
    }

    if (nextPhase === "preview") {
      clearHighlights();
      let move;
      
      try {
        move = analyzeNextStep(memoryGrid);
      } catch (e) {
        console.error("解析エンジン内部でエラーが発生しました:", e);
        writeLog("【❌解析エラー】手筋の解析中にエラーが発生し、処理を停止しました。", "err");
        btnNext.disabled = true;
        render();
        return;
      }

      if (move === "cleared") {
        writeLog("🎉 すべてのマスが論理手筋のみで美しく埋まりました！完全クリアです。", "ok");
        btnNext.disabled = true;
        render();
        return;
      }
      if (move === "stuck" || !move) {
        writeLog("これ以上、論理手筋で進められるマスが見つかりませんでした。", "info");
        btnNext.disabled = true;
        render();
        return;
      }

      currentMove = move;
      highlights.blueCells  = move.blueCells  || [];
      highlights.blueCands  = move.blueCands  || [];
      highlights.redCands   = move.redCands   || [];
      highlights.chainLinks = move.chainLinks || [];

      writeLog(move.logMsg, move.logClass);
      nextPhase = "execute";

    } else if (nextPhase === "execute") {
      if (currentMove) {
        if (currentMove.name === "Naked Single" || currentMove.name === "Hidden Single" || currentMove.name === "BUG+1") {
          const tr = currentMove.targetRow !== undefined ? currentMove.targetRow : (currentMove.targetCell ? currentMove.targetCell.row : -1);
          const tc = currentMove.targetCol !== undefined ? currentMove.targetCol : (currentMove.targetCell ? currentMove.targetCell.col : -1);
          const target = memoryGrid.find(c => c.row === tr && c.col === tc);
          if (target) {
            target.status = "solved";
            target.val = currentMove.val;
            writeLog(`  └ 確定：R${target.row+1}C${target.col+1} に 「${currentMove.val}」 を書き込みました。`, "info");
          }
        } else {
          writeLog(`  └ 削除：対象の赤色候補数字を削除しました。`, "info");
        }

        if (currentMove.redCands) {
          currentMove.redCands.forEach(rc => {
            const rr = getR(rc), cc = getC(rc);
            const cell = memoryGrid.find(c => c.row === rr && c.col === cc);
            if (cell && cell.status === "candidate" && Array.isArray(cell.val)) {
              const idx = cell.val.indexOf(rc.num);
              if (idx > -1) cell.val.splice(idx, 1);
            }
          });
        }
      }
      clearHighlights();
      currentMove = null;
      nextPhase = "preview";
    }
    render();
  }

  window.addEventListener("resize", renderOverlayLines);
  document.getElementById("btn-init-engine").addEventListener("click", setupEngine);
  btnGetCurr.addEventListener("click", fetchCurrentGrid);
  btnNext.addEventListener("click", stepForward);
  btnPrev.addEventListener("click", stepBack);

  document.getElementById("btn-auto").addEventListener("click", () => {
    let safetyCounter = 0;
    while (!btnNext.disabled && safetyCounter < 200) {
      stepForward();
      safetyCounter++;
    }

    if (nextPhase === "execute" && !btnNext.disabled) {
      stepForward();
    }

    if (safetyCounter >= 200) console.warn("安全装置が作動し自動進行を停止しました");
  });

  document.getElementById("btn-reset").addEventListener("click", setupEngine);
  document.getElementById("btn-copy").addEventListener("click", () => { 
    if (elOut.value === "") {
      alert("JSON出力がまだ生成されていません。「途中グリッドを取得」を実行してください。");
      return;
    }
    elOut.select(); document.execCommand("copy"); alert("JSONをコピーしました！"); 
  });
  
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (!confirm("すべての入力データ、検証ログ、出力JSONをリセットしますか？")) return;
    
    elTitle.value = new Date().toISOString().split('T')[0];
    elInit.value = ""; 
    elCurr.value = ""; 
    elOut.value = "";
    elLog.innerHTML = "";

    memoryGrid = [];
    historyStack = [];
    clearHighlights();
    btnPrev.disabled = true;
    btnNext.disabled = true;
    showCand = false;
    isCandidateInitialized = false;
    nextPhase = "preview";
    currentMove = null;

    elGrid.innerHTML = "";
    elSvg.innerHTML = "";

    writeLog("システムおよび盤面をリセットしました。", "info");
  });

  initDigitButtons();
  setupEngine();
})();
</script>

</body>
</html>
